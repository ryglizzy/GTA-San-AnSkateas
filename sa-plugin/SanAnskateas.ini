; SanAnskateas settings. Restart the game after editing.
[Skate]
; Converted Skate 3 data, made from your own default.xex. Relative paths
; start at the game folder.
AssetsDir=SanAnskateas\skate-data\assets
; Virtual-key code of the get on/off key (74 = J). Ctrl + that key restarts
; the Skate engine (about 10 s) if skating ever misbehaves.
ToggleKey=74
; 1 = clicking both sticks (L3 + R3) also gets on and off.
PadToggle=1
; On foot, a lone L3 (crouch) or R3 (look behind) waits this many seconds
; for the other stick before the game gets it.
ComboWindow=0.1
; Skate 3 physics difficulty: easy, normal (Skate 3's default) or hardcore.
; It changes how quickly pushes build speed; Skate 3's push top speed
; (8.5 m/s) is the same in all three. Hills and pumping go faster.
Difficulty=normal
; 1 = Skate 3's own camera while skating.
SkateCamera=1
; Seconds to blend between the game's camera and Skate's.
CameraBlendIn=0.5
CameraBlendOut=0.5
; Getting off mid-air points the game's camera down this many degrees.
ExitAirCameraPitch=15
; 1 = CJ's speed carries onto the board when you get on, and the board's
; speed carries to CJ when you get off.
CarryMomentum=1
; Getting off while rolling faster than this (m/s) hops CJ off the board, so
; he keeps his momentum through the air (on the ground the game stops him).
DismountHopSpeed=2.5
; Upward speed of that hop, in m/s.
DismountHop=3.0
; How far CJ's position sits above the skater's feet, in metres.
FeetOffset=1.0
; San Andreas collision handed to Skate around the skater, in metres.
CollisionRadius=60
; Rebuilt in the background once the skater gets this far from its centre...
CollisionRebuildDistance=20
; ...and at least this often (seconds), so moved cars and objects update.
CollisionRefreshSeconds=4
; 1 = parked cars are solid to the skater.
ParkedCarsCollide=1
; 1 = CJ's body follows the Skate skater's animation.
AnimateCJ=1
; How CJ's model is turned to match the Skate skater's: auto measures it
; from both skeletons; a number (degrees, around the up axis) overrides it.
RigFacingDegrees=auto
; CJ's arms, 0 to 1. ArmElbowFollow: how far his upper arms may roll to point
; the elbows like the Skate skater's (0 = never, 1 = up to 90 degrees; more
; roll looks pinched at the shoulder). ShoulderFollow: 0 = shoulders ride his
; chest, 1 = shrug and roll like the skater's.
ArmElbowFollow=0.5
ShoulderFollow=0.5
; How much of the game's light falls on the skateboard: 0.45 matches CJ at every
; hour. Raise it if the board looks too dark, lower it if it stands out.
BoardBrightness=0.45
; Flat floor used only where no collision is loaded, in metres.
TestFloorSize=400
